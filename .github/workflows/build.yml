name: Build EXE

on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: pip install flask requests pyinstaller
      
      - name: Ensure static folder exists
        run: |
          if (-not (Test-Path static)) { mkdir static }
          echo "<h1>REPLAY Arena</h1><p>Sistema rodando!</p>" > static/index.html
      
      - name: Build
        run: pyinstaller --onefile --noconsole --add-data "static;static" --name ReplayArena server.py
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ReplayArena
          path: dist/ReplayArena.exe
