name: Build REPLAY .exe

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Create dummy static folder
      run: |
        mkdir static
        echo "<h1>REPLAY Arena</h1><p>Sistema rodando!</p>" > static/index.html
    
    - name: Build .exe
      run: |
        pyinstaller --onefile --add-data "static;static" --name "ReplayArena" server.py
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ReplayArena-Exe
        path: dist/ReplayArena.exe
